name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand on any branch: gh workflow run ci.yml --ref <branch>

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 is the Windows 10 generation (kernel 10.0.20348), windows-2025 the
        # Windows 11 generation (10.0.26100). GitHub has no Windows 10/11 desktop x64 images.
        os: [ubuntu-latest, macos-latest, windows-2022, windows-2025]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Actions pinned to full commit SHAs (tags can be moved; SHAs can't).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-verified)
        run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Smoke test (real server, real sockets)
        run: python scripts/smoke.py
      - name: Dependency vulnerability audit
        if: runner.os == 'Linux' && matrix.python == '3.13'
        # pip-audit comes from its own hash-pinned lockfile (`pipx run` took whatever was newest that day), in its
        # own environment so that it replaces none of the packages under test.
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --require-hashes --no-deps -r requirements-audit.txt
          /tmp/audit/bin/pip-audit -r requirements.txt --require-hashes --strict
      - name: Config sanity
        run: python -m trioditis --config config.example.yaml check

  docker:
    # Builds the image and runs it the way docker-compose.yml does: read-only, no capabilities, as the host user,
    # with a pre-0.9.1 volume to move. Needs only Docker and the runner's own Python (scripts/docker_smoke.py).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the image and smoke-test it
        run: python3 scripts/docker_smoke.py

  minimum-deps:
    # pyproject.toml's lower bounds, installed exactly from .github/min-deps/, on the oldest Python CI tests.
    # tests/test_lockfiles.py keeps those pins equal to the bounds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the lowest allowed versions (hash-verified)
        run: pip install --require-hashes --no-deps -r .github/min-deps/requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Smoke test (real server, real sockets)
        run: python scripts/smoke.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (hash-verified)
        run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Ruff (rules in pyproject.toml)
        run: ruff check --output-format=github .
